name: Integration Tests
on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: Native disk-image diagnostic control only
        required: true
        default: cpu-only
        type: choice
        options: [cpu-only, full-coverage]
permissions:
  contents: read
jobs:
  native-dmg-control:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
        revision:
          - 7f1575b2a605702f3b6cba299460614316f52a6e
          - release/mac-dmg-observer-control-20260909
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.revision }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Run unchanged native lifecycle acceptance
        run: |
          python -m pip install pytest
          git rev-parse HEAD
          python -m pytest -vv -s -c tests/installer/pytest.ini tests/installer/test_macos_dmg_lifecycle.py::test_native_busy_disk_image_detaches_and_retains_payload
