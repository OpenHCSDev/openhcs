# TEMPORARY (surface R1z). Runs one failing parity case on one failing runner.
# Deleted before the PR is final.
#
# A push to refactor/R1z-* whose head commit message contains "[r1 parity-macos]"
# or "[r1 parity-windows]" runs that job. A push without a tag starts nothing.
name: R1 debug

on:
  workflow_dispatch:
    inputs:
      target:
        description: parity-macos | parity-windows
        required: true
        type: choice
        options: [parity-macos, parity-windows]
      case:
        description: Official30 case names (space separated)
        required: false
        default: ""
  push:
    branches: ["refactor/R1z-*"]

permissions:
  contents: read

concurrency:
  group: r1-debug-${{ github.sha }}
  cancel-in-progress: false

jobs:
  parity-macos:
    name: parity-macos
    if: >-
      github.event.inputs.target == 'parity-macos' ||
      contains(github.event.head_commit.message, '[r1 parity-macos]')
    uses: ./.github/workflows/r1-debug-case.yml
    with:
      os: macos-latest
      target: parity-macos
      case: ${{ github.event.inputs.case || 'ExampleHuman' }}

  parity-windows:
    name: parity-windows
    if: >-
      github.event.inputs.target == 'parity-windows' ||
      contains(github.event.head_commit.message, '[r1 parity-windows]')
    uses: ./.github/workflows/r1-debug-case.yml
    with:
      os: windows-latest
      target: parity-windows
      case: ${{ github.event.inputs.case || 'ExampleImagingFlowCytometryObjectsInGrid' }}
