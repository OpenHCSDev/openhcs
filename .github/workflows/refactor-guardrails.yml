name: Refactor Guardrails

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refactor-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural-ratchet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install tool launcher (runner only)
        run: python -m pip install uv
      - name: Run the packaged ratchet, not a copied detector
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          base="$BASE"
          if [ -z "$base" ]; then base=$(git rev-parse HEAD^); fi
          for root in openhcs scripts benchmark; do
            uvx --python 3.14 --from git+https://github.com/OpenHCSDev/agent-comms@863fbf890117f9cc5092c64726a1f175fc77d588 \
              agent-comms-ratchet --root "$root" --base "$base" --head "$HEAD"
          done

  # The R1 comparison scans the base and the head tree under one deadline.
  # Measured: 141 s for the base scan alone on a hosted runner, so about 280 s
  # for both; 160 s timed out on large diffs without a finding. 600 s is twice
  # the measured need and the value the local gate uses. The job timeout leaves
  # 10 minutes around the scan for checkout, tool install and the guard tests,
  # so the scan's own deadline reports first and the job is never just killed.
  nra-r1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install tool launcher (runner only)
        run: python -m pip install uv
      - name: Verify the policy consumer and actual workflow shells
        run: |
          uv run --no-project --python 3.12 --with pytest --with pyyaml \
            --with git+https://github.com/OpenHCSDev/NominalRefactorAdvisor@cb6942a75cf7857162a244611b76bfc284af59b3 \
            python -m pytest --noconftest -o addopts='' .github/tests/test_refactor_guardrails.py -q
      - name: Compare changed-file R1 evidence through NRA declarations
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          base="$BASE"
          if [ -z "$base" ]; then base=$(git rev-parse HEAD^); fi
          uv run --no-project --python 3.12 \
            --with git+https://github.com/OpenHCSDev/NominalRefactorAdvisor@cb6942a75cf7857162a244611b76bfc284af59b3 \
            python -m scripts.check_refactor_r1 --base "$base" --head "$HEAD" \
            --scratch-root "$RUNNER_TEMP/openhcs-r1" --budget-seconds 600
