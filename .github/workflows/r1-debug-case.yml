# TEMPORARY (surface R1z). One parity case on one runner; called by r1-debug.yml.
# Deleted before the PR is final.
name: R1 debug case

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      target:
        required: true
        type: string
      case:
        required: true
        type: string

permissions:
  contents: read

jobs:
  run:
    name: ${{ inputs.case }} (${{ inputs.os }})
    runs-on: ${{ inputs.os }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      OPENHCS_CP_NATIVE_REFERENCE_ROOT: ${{ github.workspace }}/benchmark/native_refs/official30_scoped_rows
      OPENHCS_REFERENCE_EXPORT_PIPELINES_ROOT: ${{ github.workspace }}/benchmark/reference_exports/official30_value_completion_20260914
      OPENHCS_CPU_ONLY: true
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      NUMBA_DISABLE_INTEL_SVML: ${{ inputs.os == 'macos-latest' && '1' || '0' }}
      R1_CASES: ${{ inputs.case }}
    steps:
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Build and install the candidate wheels
        run: |
          python -m pip install --upgrade pip build
          python -m scripts.install_ci_candidate \
            --dependency-source submodules \
            --wheel-directory "$RUNNER_TEMP/openhcs-candidate-wheels" \
            --extras dev,cellprofiler-compat

      - name: Configure deterministic NumPy dispatch
        run: |
          python - <<'PY'
          import os

          from benchmark.adapters.cellprofiler import (
              DETERMINISTIC_NUMPY_DISABLED_CPU_FEATURES,
              NUMPY_DISABLED_CPU_FEATURES_ENV,
          )

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(
                  f"{NUMPY_DISABLED_CPU_FEATURES_ENV}="
                  f"{DETERMINISTIC_NUMPY_DISABLED_CPU_FEATURES}\n"
              )
          PY

      - name: Materialize inputs
        env:
          OPENHCS_BENCHMARK_AUTO_ACQUIRE: "1"
          CELLPROFILER_EXAMPLES_ROOT: ${{ runner.temp }}/openhcs-official30/cellprofiler-examples
          OPENHCS_BENCHMARK_DATASET_CACHE_ROOT: ${{ runner.temp }}/openhcs-official30/datasets
        run: |
          python -c "from benchmark.cellprofiler_comparison import load_comparison_cases; print(len(load_comparison_cases('benchmark/manifests/official30_portable_axis1.json')))"
          python .github/r1-debug/probe.py

      # The run the CI job makes: no import hook, installed wheels only.
      - name: Run the case as the parity job does
        env:
          OPENHCS_BENCHMARK_AUTO_ACQUIRE: "0"
          CELLPROFILER_EXAMPLES_ROOT: ${{ runner.temp }}/openhcs-official30/cellprofiler-examples
          OPENHCS_BENCHMARK_DATASET_CACHE_ROOT: ${{ runner.temp }}/openhcs-official30/datasets
          R1_OUT: ${{ runner.temp }}/r1/plain
        run: |
          mkdir -p "$RUNNER_TEMP/r1"
          python scripts/run_installed_tests.py --repo-root "$GITHUB_WORKSPACE" -- \
            tests/integration/test_r1_debug_case.py \
            --basetemp "$RUNNER_TEMP/r1/pytest-plain" -s --tb=short 2>&1 | tee "$RUNNER_TEMP/r1/report-plain.txt"

      # The same run with the recording hook (circle inputs, arccos values, intensity traces).
      - name: Run the case with recording
        if: always()
        env:
          OPENHCS_BENCHMARK_AUTO_ACQUIRE: "0"
          CELLPROFILER_EXAMPLES_ROOT: ${{ runner.temp }}/openhcs-official30/cellprofiler-examples
          OPENHCS_BENCHMARK_DATASET_CACHE_ROOT: ${{ runner.temp }}/openhcs-official30/datasets
          R1_OUT: ${{ runner.temp }}/r1/recorded
          R1_DEBUG_DUMP_DIR: ${{ runner.temp }}/r1/circles
          OPENHCS_ZERNIKE_INTENSITY_DEBUG_TRACE_DIR: ${{ runner.temp }}/r1/intensity-traces
        run: |
          mkdir -p "$RUNNER_TEMP/r1/hook"
          cp .github/r1-debug/sitecustomize.py "$RUNNER_TEMP/r1/hook/"
          export PYTHONPATH="$RUNNER_TEMP/r1/hook"
          python scripts/run_installed_tests.py --repo-root "$GITHUB_WORKSPACE" -- \
            tests/integration/test_r1_debug_case.py \
            --basetemp "$RUNNER_TEMP/r1/pytest-recorded" -s --tb=short 2>&1 | tee "$RUNNER_TEMP/r1/report-recorded.txt"

      - name: Upload measurement tables and dumps
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r1-${{ inputs.target }}
          path: |
            ${{ runner.temp }}/r1/*.txt
            ${{ runner.temp }}/r1/circles
            ${{ runner.temp }}/r1/intensity-traces
            ${{ runner.temp }}/r1/plain/**/*.csv
            ${{ runner.temp }}/r1/plain/**/*.jsonl
            ${{ runner.temp }}/r1/recorded/**/*.csv
            ${{ runner.temp }}/r1/recorded/**/*.jsonl
          if-no-files-found: warn
          retention-days: 7
