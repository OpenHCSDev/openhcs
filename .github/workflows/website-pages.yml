name: Website

on:
  pull_request:
    paths: &website_inputs
      - "website/**"
      - "openhcs/**"
      - "external/**"
      - "scripts/**"
      - "tests/**"
      - "docs/source/_static/ui.png"
      - "paper/figures/slas/shared_workflow.png"
      - "docs/media_gallery_capture.md"
      - "pyproject.toml"
      - ".gitmodules"
      - ".github/workflows/website-pages.yml"
  push:
    branches: [main]
    paths: *website_inputs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install OpenHCS with its declared dependencies
        # The validate step imports openhcs, so it needs exactly what
        # pyproject.toml declares. The repository's own libraries come from
        # their submodules, found by the same discovery the release-floor
        # check uses, so no package list is kept here.
        run: |
          python -m pip install pytest packaging
          mapfile -t local_project_paths < <(
            python -c "from scripts.validate_local_release_floors import discover_local_projects; print(*(project.path.parent for project in discover_local_projects()), sep='\n')"
          )
          python -m pip install "${local_project_paths[@]}" -e .

      - name: Test, build, and validate landing page
        run: |
          python -m scripts.gallery_catalog --check
          python -m pytest -q -o addopts='' --confcutdir=tests/unit tests/unit/test_build_website.py
          python -m scripts.build_website --output _site

  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build landing page artifact
        run: python -m scripts.build_website --output _site

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
